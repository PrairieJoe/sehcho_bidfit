name: BidFit daily collection and analysis

on:
  schedule:
    - cron: "15 23 * * *" # 08:15 KST (UTC+9); within the 08:00-09:00 window
  workflow_dispatch:

concurrency:
  group: bidfit-daily-batch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NARAJANGTEO_SERVICE_KEY: ${{ secrets.NARAJANGTEO_SERVICE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      GEMINI_DAILY_NOTICE_LIMIT: ${{ vars.GEMINI_DAILY_NOTICE_LIMIT || '100' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run collection and analysis with transient retry
        run: |
          last_status=1
          for attempt in 1 2 3 4 5; do
            echo "[workflow] batch attempt ${attempt}/5"
            pnpm batch:daily && exit 0
            last_status=$?
            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 30))
              echo "[workflow] batch failed; retrying after ${delay} seconds"
              sleep "$delay"
            fi
          done
          exit "$last_status"
