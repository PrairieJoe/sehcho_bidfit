name: BidFit daily collection and analysis

on:
  schedule:
    - cron: "5 23 * * *" # 08:05 KST (UTC+9), inside the Nara API window
    - cron: "25 23 * * *" # 08:25 KST final watchdog before the API cutoff
  workflow_dispatch:
    inputs:
      force:
        description: "오늘 완료 배치가 있어도 실제 수집·분석을 다시 실행"
        required: false
        default: false
        type: boolean

concurrency:
  group: bidfit-daily-batch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NARAJANGTEO_SERVICE_KEY: ${{ secrets.NARAJANGTEO_SERVICE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      NODE_OPTIONS: --dns-result-order=ipv4first
      OCR_ENABLED: "true"
      FORCE_DAILY_BATCH: ${{ inputs.force || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install traditional OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr tesseract-ocr-kor poppler-utils libreoffice-writer python3-pip python3-lxml xsltproc libxml2-utils
          python3 -m pip install --user --break-system-packages pyhwp || true
      - name: Record scheduler trigger diagnostics
        run: |
          echo "[workflow] event=${{ github.event_name }} run_id=${{ github.run_id }} ref=${{ github.ref_name }}"
          echo "[workflow] utc=$(date -u --iso-8601=seconds) kst=$(TZ=Asia/Seoul date --iso-8601=seconds)"
      - name: Diagnose Nara API connectivity
        run: |
          echo "[nara-preflight] DNS records"
          getent ahosts apis.data.go.kr || true
          echo "[nara-preflight] IPv4 HTTPS probe (HTTP 401/403 still proves transport)"
          curl --ipv4 --silent --show-error --connect-timeout 15 --max-time 30 \
            --output /dev/null --write-out '[nara-preflight] ipv4 http=%{http_code} remote=%{remote_ip}\n' \
            'https://apis.data.go.kr/1230000/ad/BidPublicInfoService' || true
          echo "[nara-preflight] IPv6 HTTPS probe (no route is non-fatal)"
          curl --ipv6 --silent --show-error --connect-timeout 15 --max-time 30 \
            --output /dev/null --write-out '[nara-preflight] ipv6 http=%{http_code} remote=%{remote_ip}\n' \
            'https://apis.data.go.kr/1230000/ad/BidPublicInfoService' || true
      - name: Run collection and analysis with transient retry
        run: |
          last_status=1
          for attempt in 1 2 3 4 5; do
            echo "[workflow] batch attempt ${attempt}/5"
            set +e
            output=$(pnpm batch:daily 2>&1)
            last_status=$?
            set -e
            echo "$output"
            # An upstream 429 is a quota/rate-limit response. Repeating the
            # same request five times only extends the provider throttle window.
            if echo "$output" | grep -Eiq '429|RESOURCE_EXHAUSTED|rate limit|quota'; then
              echo "[workflow] upstream quota/rate-limit detected; stopping retries"
              exit "$last_status"
            fi
            if [ "$last_status" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 30))
              echo "[workflow] batch failed; retrying after ${delay} seconds"
              sleep "$delay"
            fi
          done
          exit "$last_status"
